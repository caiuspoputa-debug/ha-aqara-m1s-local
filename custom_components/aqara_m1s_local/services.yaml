play_sound:
  name: Play native stock sound
  description: >
    Request one local doorbell/1 playback through ha_basis. RPC acceptance is
    not playback completion. No WAV upload, FFmpeg, automatic retry or ring restore.
    Only catalog id 1 is lab-validated. Stock lab volume was tested at 1..5 percent.
  fields:
    entry_id:
      name: Config entry
      description: Required when more than one M1S is configured, unless host is supplied.
      selector:
        text:
    host:
      name: Configured hub host
      selector:
        text:
    sound_id:
      name: Validated native catalog id
      default: 1
      selector:
        number:
          min: 1
          max: 1
          mode: box
    volume:
      name: Per-request volume
      description: Must not exceed the configured native audio limit. Does not set global volume.
      selector:
        number:
          min: 1
          max: 100
          mode: box
    sound_path:
      name: Legacy path compatibility
      description: Only /data/musics/music-scene/door_bell_1.wav is mapped to native catalog id 1.
      selector:
        text:
refresh_inventory:
  name: Refresh stock inventory
  description: Read device.info again. Does not pair, delete or reset any Zigbee device.
  fields:
    entry_id:
      name: Config entry
      selector:
        text:
    host:
      name: Configured hub host
      selector:
        text:
