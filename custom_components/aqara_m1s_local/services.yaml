play_sound:
  name: Play native stock sound
  description: >
    Request one local native catalog playback through ha_basis. RPC acceptance is
    not playback completion. No WAV upload, FFmpeg, automatic retry or ring restore.
    Only existing mapped scene sounds are accepted. Doorbell/1 is physically lab-validated;
    the other scene mappings are not. Stock lab volume was tested at 1..5 percent.
  fields:
    entry_id:
      name: Config entry
      description: Required when more than one M1S is configured, unless host is supplied.
      selector:
        text:
    host:
      name: Configured hub host
      selector:
        text:
    sound_id:
      name: Native family index
      default: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    sound_type:
      name: Native sound family
      default: doorbell
      selector:
        select:
          options:
            - doorbell
            - welcome
            - alarm
    volume:
      name: Per-request volume
      description: Must not exceed the configured native audio limit. Does not set global volume.
      selector:
        number:
          min: 1
          max: 100
          mode: box
    sound_path:
      name: Legacy path compatibility
      description: Must exactly match an existing mapped native scene WAV. No arbitrary file playback.
      selector:
        text:
refresh_inventory:
  name: Refresh stock inventory
  description: Read device.info again. Does not pair, delete or reset any Zigbee device.
  fields:
    entry_id:
      name: Config entry
      selector:
        text:
    host:
      name: Configured hub host
      selector:
        text:
