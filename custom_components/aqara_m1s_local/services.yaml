play_url:
  name: Play URL
  description: Download a WAV URL to /tmp and play it on the Aqara M1S.
  fields:
    host:
      name: Host
      required: false
      selector:
        text:
    port:
      name: Port
      required: false
      default: 23
      selector:
        number:
          min: 1
          max: 65535
    url:
      name: URL
      required: true
      selector:
        text:
    volume:
      name: Volume
      required: false
      default: 20
      selector:
        number:
          min: 0
          max: 100

play_sound:
  name: Play Sound
  description: Play a WAV file already present on the Aqara M1S filesystem.
  fields:
    host:
      name: Host
      required: false
      selector:
        text:
    port:
      name: Port
      required: false
      default: 23
      selector:
        number:
          min: 1
          max: 65535
    path:
      name: Path
      required: true
      selector:
        text:
    volume:
      name: Volume
      required: false
      default: 20
      selector:
        number:
          min: 0
          max: 100

run_command:
  name: Run Command
  description: Run a shell command on the Aqara M1S over Telnet.
  fields:
    host:
      name: Host
      required: false
      selector:
        text:
    port:
      name: Port
      required: false
      default: 23
      selector:
        number:
          min: 1
          max: 65535
    command:
      name: Command
      required: true
      selector:
        text:
